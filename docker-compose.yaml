services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: zeroenglish
        env_file:
            - .env
        environment:
            - NODE_ENV=production
            - PORT=3000
            - HOSTNAME=0.0.0.0
        ports:
            - "${PORT:-3000}:3000"
        volumes:
            # Persist winston daily-rotate logs written to /app/logs
            - ./logs:/app/logs
        restart: unless-stopped